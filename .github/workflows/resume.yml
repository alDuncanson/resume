name: Build and Deploy Resume

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('preview-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name != 'pull_request' && 'github-pages' || '' }}
      url: ${{ steps.md-press.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Build and deploy resume
        id: md-press
        uses: alDuncanson/md-press@v0.3.0
        with:
          source: resume.md
          output-pdf: resume.pdf
